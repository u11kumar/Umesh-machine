
# ============================================================
# Kitty Terminal Configuration
# Theme: Purple Dark (Aesthetic)
# Font: JetBrainsMono Nerd Font
# ============================================================

# -------------------------
# Font Configuration
# -------------------------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# Improve font rendering
adjust_line_height  2
adjust_column_width 0
disable_ligatures   never

# -------------------------
# Cursor
# -------------------------
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# -------------------------
# Scrollback (Tail Enabled)
# -------------------------
scrollback_lines 10000
scrollback_pager kitty +kitten scrollback --tail
wheel_scroll_multiplier 5.0

# -------------------------
# Window Layout & Padding
# -------------------------
window_padding_width 14
window_margin_width 6
confirm_os_window_close 0

# Smooth resizing
resize_debounce_time 0.1

# -------------------------
# Background & Transparency
# -------------------------
background_opacity 0.80
dynamic_background_opacity yes
dim_opacity 0.65

# Blur (Wayland / compositor dependent)
background_blur 20

# -------------------------
# Purple Dark Color Scheme
# -------------------------
foreground            #E6DFF1
background            #0F0A1A

selection_foreground  #0F0A1A
selection_background  #C77DFF

cursor                #C77DFF
cursor_text_color     #0F0A1A

# Normal colors
color0  #1A132B
color1  #FF5C8A
color2  #5AF78E
color3  #F3F99D
color4  #9D7CFF
color5  #C77DFF
color6  #7AE8FF
color7  #E6DFF1

# Bright colors
color8  #3A2F5C
color9  #FF7AA2
color10 #7CFFB2
color11 #FBFFA3
color12 #B79CFF
color13 #E4B5FF
color14 #9AEDFF
color15 #FFFFFF

# -------------------------
# Tab Bar (Minimal Aesthetic)
# -------------------------
tab_bar_style powerline
tab_powerline_style angled
tab_bar_edge bottom
tab_bar_min_tabs 1

active_tab_foreground   #0F0A1A
active_tab_background   #C77DFF
inactive_tab_foreground #A599C9
inactive_tab_background #1A132B

# -------------------------
# Bell & Notifications
# -------------------------
enable_audio_bell no
visual_bell_duration 0.2

# -------------------------
# Performance
# -------------------------
repaint_delay 8
input_delay 2
sync_to_monitor yes
cursor_trail 3 

# -------------------------
# Keybindings (Quality of Life)
# -------------------------
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+w close_window
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# -------------------------
# End of Config
# -------------------------
